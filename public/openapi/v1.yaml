openapi: 3.1.0
info:
  title: Yokaiba API
  version: 0.1.0
  description: |
    Deterministic, uniquely-solvable judo logic-grid puzzles. REST is public; MCP uses a separate API key.
    Cross-origin browser clients must be listed in the `REST_ALLOWED_ORIGINS` Worker secret; unlisted origins receive no CORS permission.
servers:
  - url: /
    description: Current deployment (used by Swagger UI)
  - url: https://yokaiba.scheimann.workers.dev
    description: Production
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Service is available
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /readyz:
    get:
      summary: Readiness check, including rate-limit provider configuration
      responses:
        '200':
          description: Service is ready to receive traffic
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /docs:
    get:
      summary: Interactive Swagger UI
      responses:
        '200':
          description: Browser-based API reference
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            text/html: { schema: { type: string } }
  /openapi/v1.yaml:
    get:
      summary: Download the OpenAPI contract
      responses:
        '200':
          description: OpenAPI 3.1 YAML document
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/yaml: { schema: { type: string } }
  /v1/scenarios:
    get:
      summary: List available puzzle scenarios
      responses:
        '200':
          description: Curated puzzle scenarios
          headers:
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
            ETag: { $ref: '#/components/headers/Etag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/version:
    get:
      summary: Return service and reproducibility versions
      responses:
        '200':
          description: Current versions
          headers:
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
            ETag: { $ref: '#/components/headers/Etag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/puzzles/generate:
    get:
      summary: Generate a cacheable deterministic puzzle
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/Seed'
        - $ref: '#/components/parameters/DifficultyLevel'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A reproducible puzzle without its hidden solution
          headers:
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            ETag: { $ref: '#/components/headers/Etag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedPuzzle' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DifficultyUnavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      summary: Generate a deterministic puzzle from a JSON request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerationRequest' }
      responses:
        '200':
          description: A reproducible puzzle without its hidden solution
          headers:
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedPuzzle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DifficultyUnavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/puzzles/verify:
    post:
      summary: Verify a submitted puzzle answer
      description: |
        Checks a complete answer server-side using a signed token returned by puzzle generation.
        The response never reveals the hidden solution or which entries are incorrect.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PuzzleVerificationRequest' }
      responses:
        '200':
          description: The answer was checked.
          headers:
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
            RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PuzzleVerificationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/NotConfigured' }
components:
  parameters:
    TemplateId:
      name: templateId
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    Seed:
      name: seed
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DifficultyLevel:
      name: difficultyLevel
      in: query
      required: false
      description: Selects a reproducible puzzle at this assessed difficulty without changing the supplied seed. Returns 422 when none of the deterministic clue strategies for that seed meets the requested level.
      schema: { type: integer, minimum: 1, maximum: 12 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
  headers:
    AccessControlAllowOrigin:
      schema: { type: string, format: uri }
      description: Echoes an explicitly allowlisted browser origin; absent for other origins.
    CacheControl:
      schema: { type: string, example: public, max-age=300, s-maxage=300, must-revalidate }
      description: Short-lived cache policy; clients must revalidate after expiry.
    Etag:
      schema: { type: string }
      description: Content-derived validator for conditional GET requests.
    RequestId:
      schema: { type: string, format: uuid }
      description: Correlation ID for support and Worker logs.
    RateLimitLimit:
      schema: { type: integer, minimum: 1 }
    RateLimitPolicy:
      schema: { type: string, example: 60;w=60 }
    RateLimitRemaining:
      schema: { type: integer, minimum: 0 }
      description: Remaining requests in the current window when locally enforced; absent for the Cloudflare binding.
    RateLimitReset:
      schema: { type: integer, minimum: 0 }
      description: Unix-second window reset time when locally enforced; absent for the Cloudflare binding.
  responses:
    BadRequest:
      description: Invalid request input
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Unknown route or template
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    DifficultyUnavailable:
      description: The requested seed has no clue strategy in the requested difficulty band.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotModified:
      description: The representation matches the supplied ETag.
      headers:
        ETag: { $ref: '#/components/headers/Etag' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotConfigured:
      description: The service is missing required server configuration.
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Health:
      type: object
      required: [status, build]
      properties:
        status: { type: string, const: ok }
        build: { $ref: '#/components/schemas/Build' }
    Readiness:
      type: object
      required: [status, build, rateLimitProvider]
      properties:
        status: { type: string, const: ready }
        build: { $ref: '#/components/schemas/Build' }
        rateLimitProvider: { type: string, enum: [configured, fallback] }
    Build:
      type: object
      required: [serviceVersion, buildSha]
      properties:
        serviceVersion: { type: string }
        buildSha: { type: string, description: Immutable deployment revision or local for development. }
    Version:
      type: object
      required: [serviceVersion, buildSha, generatorVersion, solverVersion]
      properties:
        serviceVersion: { type: string }
        buildSha: { type: string }
        generatorVersion: { type: string }
        solverVersion: { type: string }
    TemplateMetadata:
      type: object
      required: [locales, difficultyCalibration]
      properties:
        locales:
          type: object
          required: [default, supported]
          properties:
            default: { type: string, example: en }
            supported: { type: array, items: { type: string } }
        difficultyCalibration:
          type: object
          required: [modelVersion, scoreThresholds, corpus]
          properties:
            modelVersion: { type: string }
            scoreThresholds: { type: array, minItems: 4, maxItems: 4, items: { type: number } }
            corpus: { type: object, additionalProperties: true }
    Scenario:
      type: object
      required: [id, title, baseCategory, categories]
      properties:
        id: { type: string }
        title: { type: string }
        baseCategory: { type: string }
        categories:
          type: array
          description: Board categories and values, provided so clients can render a puzzle before generation.
          items: { $ref: '#/components/schemas/Category' }
        metadata: { $ref: '#/components/schemas/TemplateMetadata' }
    ScenarioList:
      type: object
      required: [scenarios]
      properties: { scenarios: { type: array, items: { $ref: '#/components/schemas/Scenario' } } }
    GenerationRequest:
      type: object
      required: [templateId, seed]
      additionalProperties: false
      properties:
        templateId: { type: string, minLength: 1, maxLength: 128 }
        seed: { type: string, minLength: 1, maxLength: 128 }
        difficultyLevel: { type: integer, minimum: 1, maximum: 12 }
    Constraint:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [matches, notMatches, before, adjacent, sameRow, distance] }
      additionalProperties: true
    Clue:
      type: object
      required: [id, constraint, text]
      properties:
        id: { type: string }
        constraint: { $ref: '#/components/schemas/Constraint' }
        text: { type: string }
        phraseVariant: { type: string, description: Deterministic phrase-catalogue choice for exact replay. }
        languageVersion: { type: string, description: Version of the clue phrase catalogue. }
    Category:
      type: object
      required: [id, label, values]
      properties:
        id: { type: string }
        label: { type: string }
        values: { type: array, items: { type: string } }
        ordered: { type: boolean }
    PuzzleSpec:
      type: object
      required: [id, title, baseCategory, categories]
      properties:
        id: { type: string }
        title: { type: string }
        baseCategory: { type: string }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
    GeneratedPuzzle:
      type: object
      required: [id, requestedSeed, seed, templateId, generatorVersion, solverVersion, spec, clues, difficulty]
      properties:
        id: { type: string }
        requestedSeed: { type: string, description: The seed provided by the caller. }
        seed: { type: string }
        requestedDifficultyLevel: { type: integer, minimum: 1, maximum: 12 }
        templateId: { type: string }
        generatorVersion: { type: string }
        solverVersion: { type: string }
        puzzleToken:
          type: string
          description: HMAC-signed token required by the verification endpoint. Its base64url payload contains reproducibility metadata (including the seed), so it is not an encryption or anti-cheating mechanism; present when PUZZLE_TOKEN_SECRET is configured.
        spec: { $ref: '#/components/schemas/PuzzleSpec' }
        clues: { type: array, items: { $ref: '#/components/schemas/Clue' } }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
      not: { required: [solution] }
    Difficulty:
      type: object
      required: [level, label, modelVersion, evidence]
      properties:
        level: { type: integer, minimum: 1, maximum: 12 }
        label: { type: string }
        modelVersion: { type: string, example: yokaiba-difficulty-v4 }
        evidence:
          type: object
          required: [score, humanSolve, clueStructure, solver]
          properties:
            score: { type: integer }
            humanSolve: { type: object, additionalProperties: true }
            clueStructure: { type: object, additionalProperties: true }
            solver: { type: object, additionalProperties: true }
    SolutionAnswer:
      type: object
      required: [assignments]
      additionalProperties: false
      properties:
        assignments:
          type: object
          description: Each non-base category maps base-row order to a complete permutation of its values.
          additionalProperties:
            type: array
            items: { type: string }
    PuzzleVerificationRequest:
      type: object
      required: [puzzleToken, answer]
      additionalProperties: false
      properties:
        puzzleToken: { type: string, minLength: 1 }
        answer: { $ref: '#/components/schemas/SolutionAnswer' }
    PuzzleVerificationResult:
      type: object
      required: [correct]
      properties:
        correct: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string } }
