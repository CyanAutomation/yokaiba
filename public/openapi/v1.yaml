openapi: 3.1.0
info:
  title: Yokaiba API
  version: 0.1.0
  description: |
    Deterministic, uniquely-solvable judo logic-grid puzzles. REST is public; MCP uses a separate API key.
    Cross-origin browser clients must be listed in the `REST_ALLOWED_ORIGINS` Worker secret; unlisted origins receive no CORS permission.
servers:
  - url: /
    description: Current deployment (used by Swagger UI)
  - url: https://yokaiba.scheimann.workers.dev
    description: Production
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Service is available
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /docs:
    get:
      summary: Interactive Swagger UI
      responses:
        '200':
          description: Browser-based API reference
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            text/html: { schema: { type: string } }
  /openapi/v1.yaml:
    get:
      summary: Download the OpenAPI contract
      responses:
        '200':
          description: OpenAPI 3.1 YAML document
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/yaml: { schema: { type: string } }
  /v1/scenarios:
    get:
      summary: List available puzzle scenarios
      responses:
        '200':
          description: Curated puzzle scenarios
          headers:
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
            ETag: { $ref: '#/components/headers/Etag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/version:
    get:
      summary: Return service and reproducibility versions
      responses:
        '200':
          description: Current versions
          headers:
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
            ETag: { $ref: '#/components/headers/Etag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/puzzles/generate:
    get:
      summary: Generate a cacheable deterministic puzzle
      parameters:
        - $ref: '#/components/parameters/TemplateId'
        - $ref: '#/components/parameters/Seed'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A reproducible puzzle without its hidden solution
          headers:
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
            ETag: { $ref: '#/components/headers/Etag' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedPuzzle' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      summary: Generate a deterministic puzzle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerationRequest' }
      responses:
        '200':
          description: A reproducible puzzle without its hidden solution
          headers:
            Access-Control-Allow-Origin: { $ref: '#/components/headers/AccessControlAllowOrigin' }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedPuzzle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  parameters:
    TemplateId:
      name: templateId
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    Seed:
      name: seed
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
  headers:
    AccessControlAllowOrigin:
      schema: { type: string, format: uri }
      description: Echoes an explicitly allowlisted browser origin; absent for other origins.
    CacheControl:
      schema: { type: string, example: public, max-age=300, s-maxage=300, must-revalidate }
      description: Short-lived cache policy; clients must revalidate after expiry.
    Etag:
      schema: { type: string }
      description: Content-derived validator for conditional GET requests.
    RequestId:
      schema: { type: string, format: uuid }
      description: Correlation ID for support and Worker logs.
  responses:
    BadRequest:
      description: Invalid request input
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Unknown route or template
      headers: { X-Request-Id: { $ref: '#/components/headers/RequestId' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotModified:
      description: The representation matches the supplied ETag.
      headers:
        ETag: { $ref: '#/components/headers/Etag' }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, const: ok } }
    Version:
      type: object
      required: [serviceVersion, generatorVersion, solverVersion]
      properties:
        serviceVersion: { type: string }
        generatorVersion: { type: string }
        solverVersion: { type: string }
    Scenario:
      type: object
      required: [id, title]
      properties: { id: { type: string }, title: { type: string } }
    ScenarioList:
      type: object
      required: [scenarios]
      properties: { scenarios: { type: array, items: { $ref: '#/components/schemas/Scenario' } } }
    GenerationRequest:
      type: object
      required: [templateId, seed]
      additionalProperties: false
      properties:
        templateId: { type: string, minLength: 1, maxLength: 128 }
        seed: { type: string, minLength: 1, maxLength: 128 }
    Constraint:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [matches, notMatches, before, adjacent] }
      additionalProperties: true
    Clue:
      type: object
      required: [id, constraint, text]
      properties:
        id: { type: string }
        constraint: { $ref: '#/components/schemas/Constraint' }
        text: { type: string }
    Category:
      type: object
      required: [id, label, values]
      properties:
        id: { type: string }
        label: { type: string }
        values: { type: array, items: { type: string } }
        ordered: { type: boolean }
    PuzzleSpec:
      type: object
      required: [id, title, baseCategory, categories]
      properties:
        id: { type: string }
        title: { type: string }
        baseCategory: { type: string }
        categories: { type: array, items: { $ref: '#/components/schemas/Category' } }
    GeneratedPuzzle:
      type: object
      required: [id, seed, templateId, generatorVersion, solverVersion, spec, clues]
      properties:
        id: { type: string }
        seed: { type: string }
        templateId: { type: string }
        generatorVersion: { type: string }
        solverVersion: { type: string }
        spec: { $ref: '#/components/schemas/PuzzleSpec' }
        clues: { type: array, items: { $ref: '#/components/schemas/Clue' } }
      not: { required: [solution] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string } }
