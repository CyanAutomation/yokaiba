name = "yokaiba"
main = "worker/main.ts"
compatibility_date = "2026-08-29"
[observability]
enabled = true

  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1

[cache]
enabled = true
# Keep deployments isolated so changed generation behavior cannot reuse prior responses.
cross_version_cache = false

[exports.default]
type = "worker"

  [exports.default.cache]
  enabled = false

[exports.CachedPublic]
type = "worker"

  [exports.CachedPublic.cache]
  enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/docs", "/docs/", "/utcp", "/openapi/*"]

[vars]
# Canonical origin used in UTCP HTTP call templates. Override for a custom domain.
PUBLIC_API_BASE_URL = "https://yokaiba.scheimann.workers.dev"

[[d1_databases]]
binding = "PUZZLE_FEEDBACK"
database_name = "yokaiba-puzzle-feedback"
database_id = "18db62b2-9b51-47fb-b233-2155f5db924b"
migrations_dir = "migrations"

[[analytics_engine_datasets]]
binding = "PUZZLE_OUTCOMES"
dataset = "yokaiba_puzzle_outcomes"

# Set these as Worker secrets before deployment:
#   npx wrangler secret put REST_ALLOWED_ORIGINS
#   npx wrangler secret put PUZZLE_TOKEN_SECRET
#   npx wrangler secret put PUZZLE_TOKEN_PREVIOUS_SECRETS # optional JSON array during key rotation
#   npx wrangler secret put PUZZLE_TOKEN_TTL_SECONDS # optional, default 604800 seconds
# REST_ALLOWED_ORIGINS is a comma-separated list of exact browser origins that
# may call the public REST API. It is intentionally unset by default.
# PUZZLE_TOKEN_SECRET signs browser puzzle tokens used by /v1/puzzles/verify.
# PUZZLE_TOKEN_PREVIOUS_SECRETS is an optional JSON array of previous keys accepted during rotation grace.
# PUZZLE_TOKEN_TTL_SECONDS controls newly issued token lifetime (default seven days, maximum 30 days).
# REST_GENERATE_RATE_LIMIT is the local fallback for REST generation (default 10/minute).
# VERIFY_RATE_LIMIT is the local fallback for verification attempts per minute (default 10).
# FEEDBACK_RATE_LIMIT is the local fallback for puzzle feedback (default 10/minute).

[[ratelimits]]
name = "REST_RATE_LIMITER"
namespace_id = "870282"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "REST_GENERATE_RATE_LIMITER"
# Keep expensive generation traffic in a separate namespace and quota.
namespace_id = "870288"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "VERIFY_RATE_LIMITER"
# This shared namespace enforces 10/minute for answer verification, hints, and
# feedback. Those operations fail closed if the provider errors; local fallbacks
# are used only when this binding is not configured.
namespace_id = "870283"

  [ratelimits.simple]
  limit = 10
  period = 60
