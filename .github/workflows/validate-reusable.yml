name: Shared validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build actionlint image
        run: docker build --tag yokaiba-actionlint .github/actionlint

      - name: Lint GitHub Actions workflows
        run: |
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -0 docker run --rm \
                --volume "$GITHUB_WORKSPACE:/repo:ro" \
                --workdir /repo \
                yokaiba-actionlint

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.100.0
          target: wasm32-unknown-unknown
          components: rustfmt,clippy

      - run: npm ci
      - name: Check Worker runtime imports with Fallow
        run: npm run fallow:policy
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - name: Report TypeScript health with coverage
        run: npm run fallow:health -- --coverage coverage/coverage-final.json
      - name: Audit changed code with Fallow
        run: npm run fallow:audit -- --coverage coverage/coverage-final.json --format compact --quiet
