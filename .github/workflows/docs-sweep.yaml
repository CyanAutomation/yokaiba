name: Kaseki Docs Sweep

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to inspect
        required: true
        default: main
        type: string
      task_description:
        description: What Kaseki should do
        required: true
        default: Keep README.md and docs/ accurate against the current implementation.
        type: string
      allowlist:
        description: Permitted changed-file patterns, comma-separated
        required: true
        default: README.md,docs/**/*.md
        type: string
      validation_command:
        description: Validation command to run (leave blank for none)
        required: false
        default: npm run typecheck && npm test
        type: string

run-name: >-
  Docs sweep · ${{ github.repository }}@${{ inputs.ref || github.event.repository.default_branch }}

permissions:
  contents: read

concurrency:
  group: kaseki-docs-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  system_status:
    name: Kaseki System Status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # Set this repository or organization variable to the stable HTTPS Kaseki
      # controller origin. Never fall back to a tunnel controlled outside GitHub.
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
    steps:
      - name: Validate controller configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"
          case "$KASEKI_BASE_URL" in
            https://*) ;;
            *) echo "KASEKI_BASE_URL must be an HTTPS origin." >&2; exit 1 ;;
          esac

      - name: Verify controller health
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/health"
          jq -e '.status == "healthy"' "$response_file" >/dev/null
          jq . "$response_file"

  readiness:
    name: Kaseki System Readiness
    needs: system_status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
    steps:
      - name: Verify controller readiness
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/ready"
          jq -e '.status == "ready"' "$response_file" >/dev/null
          jq . "$response_file"

  api_connection:
    name: Kaseki API Status
    needs: readiness
    environment: kaseki
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
      KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
    steps:
      - name: Verify gateway connectivity and authentication
        shell: bash
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_BASE_URL/api/gateway-test?stage=1"
          jq -e '.status == "ok"' "$response_file" >/dev/null
          jq . "$response_file"

  dispatch:
    name: Submit Kaseki documentation sweep
    needs: api_connection
    environment: kaseki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.submit.outputs.run_id }}
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}

      # Automatically targets the repository containing this workflow.
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # workflow_dispatch inputs are empty for scheduled events, so defaults
      # must be applied here as well as in the manual-dispatch form.
      REF: ${{ inputs.ref || github.event.repository.default_branch }}
      TASK_DESCRIPTION: ${{ inputs.task_description || 'Keep README.md and docs/ accurate against the current implementation.' }}
      ALLOWLIST: ${{ inputs.allowlist || 'README.md,docs/**/*.md' }}
      VALIDATION_COMMAND: ${{ inputs.validation_command || 'npm run typecheck && npm test' }}
      IDEMPOTENCY_KEY: kaseki-docs-sweep-${{ github.run_id }}

    steps:
      - name: Check Kaseki availability
        run: |
          curl --fail --silent --show-error --max-time 20 \
            "$KASEKI_BASE_URL/ready"

      - name: Submit documentation sweep
        id: submit
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$IDEMPOTENCY_KEY" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                idempotencyKey: $idempotencyKey,
                taskMode: "patch",
                timeoutSeconds: 10800,
                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),
                validationCommands: (
                  if $validationCommand == "" then []
                  else [$validationCommand]
                  end
                ),
                goalCheck: {
                  enabled: true,
                  maxRetries: 1
                },
                taskPrompt: (
                  $taskDescription
                  + "\n\nPerform the documentation sweep for this repository. "
                  + "First read repository instructions, then inspect the current "
                  + "implementation and compare it against README.md and documentation "
                  + "under docs/. Update documentation only where inaccurate, incomplete, "
                  + "or stale. Do not modify application code, tests, configuration, "
                  + "dependencies, lockfiles, CI workflows, or generated files. "
                  + "Do not invent behavior. Avoid cosmetic rewrites. Before finishing, "
                  + "review the diff to confirm it contains documentation-only changes. "
                  + "If documentation is already accurate, make no changes and do not "
                  + "open a pull request."
                )
              }'
          )"
          
          response_file="$(mktemp)"

          http_status="$(
            curl --silent --show-error \
              --retry 3 --retry-all-errors --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$KASEKI_BASE_URL/api/runs" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"
            echo "Kaseki response (HTTP $http_status):"
            cat "$response_file"

            {
              echo "## Kaseki submission failed"
              echo
              echo "Kaseki returned HTTP \`$http_status\`."
              echo
              echo "### Response"
              echo '```json'
              jq . "$response_file" 2>/dev/null || cat "$response_file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          response="$(<"$response_file")"
          echo "$response" | jq .
          run_id="$(echo "$response" | jq -er '.id')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Publish submission details
        run: |
          {
            echo "## Kaseki submission"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Mode | \`patch\` |"
            echo "| Timeout | 3 hours |"
            echo "| Kaseki run | \`${{ steps.submit.outputs.run_id }}\` |"
            echo
            echo "### Allowed paths"
            echo '```text'
            echo "$ALLOWLIST" | tr ',' '\n'
            echo '```'
            echo
            echo "### Task description"
            echo "$TASK_DESCRIPTION"
            echo
            echo "### Validation"
            echo '```text'
            echo "${VALIDATION_COMMAND:-No validation command configured}"
            echo '```'
            echo
            echo "Monitor the run: $KASEKI_BASE_URL/ui"
          } >> "$GITHUB_STEP_SUMMARY"

  monitor:
    name: Monitor Kaseki documentation sweep
    needs: dispatch
    environment: kaseki
    runs-on: ubuntu-latest
    # Kaseki receives a 3-hour run budget. Allow a small amount of polling
    # overhead, then make a delayed or stuck run visible as a failed workflow.
    timeout-minutes: 190
    env:
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}
      KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
      KASEKI_RUN_ID: ${{ needs.dispatch.outputs.run_id }}
    steps:
      - name: Wait for a terminal Kaseki status
        shell: bash
        run: |
          set -euo pipefail
          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          : "${KASEKI_RUN_ID:?Kaseki submission did not return a run ID}"

          for attempt in $(seq 1 360); do
            response_file="$(mktemp)"
            trap 'rm -f "$response_file"' EXIT
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              --output "$response_file" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              "$KASEKI_BASE_URL/api/runs/$KASEKI_RUN_ID/status"

            status="$(jq -er '.status' "$response_file")"
            jq '{ id, status, elapsedSeconds, failureClass, failedCommand, error }' "$response_file"
            rm -f "$response_file"
            trap - EXIT

            case "$status" in
              completed) exit 0 ;;
              failed) echo "Kaseki run $KASEKI_RUN_ID failed." >&2; exit 1 ;;
              queued|running) sleep 30 ;;
              *) echo "Kaseki returned an unknown run status: $status" >&2; exit 1 ;;
            esac
          done

          echo "Kaseki run $KASEKI_RUN_ID did not reach a terminal status within the workflow budget." >&2
          exit 1
