name: Kaseki Docs Sweep

on:
  schedule:
    - cron: "0 1 * * 3"
  workflow_dispatch:

run-name: >-
  Docs sweep · ${{ github.repository }}@${{ github.ref_name }}

permissions:
  contents: read

concurrency:
  group: kaseki-sweeps-${{ github.repository }}
  cancel-in-progress: false

env:
  REPO_URL: ${{ github.server_url }}/${{ github.repository }}
  REF: ${{ github.sha }}
  TASK_DESCRIPTION: Keep README.md and docs/ accurate against the current implementation.
  ALLOWLIST: README.md,docs/**/*.md
  VALIDATION_COMMAND: npm run typecheck && npm test && npm run build

jobs:
  docs_sweep:
    name: Run Kaseki documentation sweep
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Kaseki allows a run to last three hours; allow time for preflight and
    # terminal status polling without approaching the runner's hard limit.
    timeout-minutes: 200
    environment: kaseki-agent
    env:
      # Do not add a public fallback URL.
      KASEKI_BASE_URL: ${{ vars.KASEKI_BASE_URL }}

    steps:
      - name: Validate Kaseki controller URL
        shell: bash
        run: |
          set -euo pipefail

          : "${KASEKI_BASE_URL:?KASEKI_BASE_URL is not configured}"

          [[ "$KASEKI_BASE_URL" == "https://kaseki-tunnel.scheimann.xyz" ]] || {
            echo "::error title=Invalid Kaseki controller URL::Use the approved HTTPS controller URL."
            exit 1
          }

      - name: Verify controller health
        uses: CyanAutomation/kaseki-agent/.github/actions/verify-controller-health@30db5d15e117b8d8de13eb66766d48cf6b7d618b
        with:
          base-url: ${{ vars.KASEKI_BASE_URL }}

      - name: Verify controller readiness
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            --output "$response_file" \
            "$KASEKI_BASE_URL/ready"

          jq -e '.status == "ready"' "$response_file" >/dev/null

      - name: Verify gateway connectivity and authentication
        shell: bash
        env:
          # Store this as an environment secret, rather than a repository secret.
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 60 \
            --output "$response_file" \
            --header "Authorization: Bearer $KASEKI_API_TOKEN" \
            "$KASEKI_BASE_URL/api/gateway-test?stage=1"

          jq -e '.status == "ok"' "$response_file" >/dev/null

      - name: Submit documentation sweep
        id: submit
        shell: bash
        env:
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
        run: |
          set -euo pipefail

          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"

          idempotency_key="$(
            uuidgen --sha1 --namespace @dns --name "$GITHUB_REPOSITORY:$GITHUB_WORKFLOW:$GITHUB_RUN_ID" \
              | tr '[:upper:]' '[:lower:]'
          )"

          payload="$(
            jq -n \
              --arg repoUrl "$REPO_URL" \
              --arg ref "$REF" \
              --arg taskDescription "$TASK_DESCRIPTION" \
              --arg validationCommand "$VALIDATION_COMMAND" \
              --arg allowlist "$ALLOWLIST" \
              --arg idempotencyKey "$idempotency_key" \
              '{
                repoUrl: $repoUrl,
                ref: $ref,
                idempotencyKey: $idempotencyKey,
                taskMode: "patch",
                publishMode: "pr",
                timeoutSeconds: 10800,
                maxDiffBytes: 102400,

                scouting: {
                  enabled: false
                },

                goalSetting: {
                  enabled: false
                },

                goalCheck: {
                  enabled: false
                },

                changedFilesAllowlist: (
                  $allowlist
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | map(select(length > 0))
                ),

                validationCommands: (
                  if $validationCommand == "" then
                    []
                  else
                    [$validationCommand]
                  end
                ),

                taskPrompt: (
                  $taskDescription
                  + "\n\nPerform the documentation sweep for this repository. "
                  + "First read repository instructions, then inspect the current "
                  + "implementation and compare it against README.md and documentation "
                  + "under docs/. Update documentation only where inaccurate, incomplete, "
                  + "or stale. Do not modify application code, tests, configuration, "
                  + "dependencies, lockfiles, CI workflows, or generated files. "
                  + "Do not invent behavior. Avoid cosmetic rewrites. Before finishing, "
                  + "review the diff to confirm it contains documentation-only changes. "
                  + "If documentation is already accurate, make no changes and do not "
                  + "open a pull request."
                )
              }'
          )"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 60 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "$KASEKI_BASE_URL/api/runs" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload"
          )"

          if [[ ! "$http_status" =~ ^2 ]]; then
            echo "::error title=Kaseki submission failed::Kaseki returned HTTP $http_status"

            {
              echo "## Kaseki submission failed"
              echo
              echo "Kaseki returned HTTP \`$http_status\`."
              echo
              echo "The controller response body is intentionally omitted from logs and summaries."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          run_id="$(
            jq -er \
              '.id | strings | select(test("^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"))' \
              "$response_file"
          )"

          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Kaseki completion
        id: wait
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id }}
          KASEKI_API_TOKEN: ${{ secrets.KASEKI_API_TOKEN }}
          KASEKI_POLL_TIMEOUT_SECONDS: "11100"
        run: |
          set -euo pipefail

          : "${KASEKI_API_TOKEN:?KASEKI_API_TOKEN is not configured}"
          : "${KASEKI_POLL_TIMEOUT_SECONDS:?Configure a Kaseki polling deadline}"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          # Kaseki allows a three-hour run. Poll for up to 185 minutes to
          # observe a terminal result, leaving margin under the job timeout.
          poll_deadline=$((SECONDS + KASEKI_POLL_TIMEOUT_SECONDS))
          while (( SECONDS < poll_deadline )); do
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              --output "$response_file" \
              --header "Authorization: Bearer $KASEKI_API_TOKEN" \
              "$KASEKI_BASE_URL/api/runs/$RUN_ID/status"

            status="$(jq -er '.status' "$response_file")"

            case "$status" in
              completed)
                echo "status=$status" >> "$GITHUB_OUTPUT"
                echo "Kaseki status: completed"
                exit 0
                ;;

              failed)
                echo "status=$status" >> "$GITHUB_OUTPUT"
                echo "Kaseki status: failed"
                exit 1
                ;;

              queued|running)
                echo "Kaseki status: $status"
                remaining=$((poll_deadline - SECONDS))
                if (( remaining > 60 )); then
                  sleep 60
                elif (( remaining > 0 )); then
                  sleep "$remaining"
                fi
                ;;

              *)
                echo "::error title=Unexpected Kaseki status::Controller returned an unsupported status"
                exit 1
                ;;
            esac
          done

          timeout_minutes=$((KASEKI_POLL_TIMEOUT_SECONDS / 60))
          echo "::error title=Kaseki run timed out::No terminal status after ${timeout_minutes} minutes"
          exit 1

      - name: Publish run details
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.submit.outputs.run_id || 'not submitted' }}
          FINAL_STATUS: ${{ steps.wait.outputs.status || 'not completed' }}
        run: |
          {
            echo "## Kaseki documentation sweep"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Repository | \`$REPO_URL\` |"
            echo "| Ref | \`$REF\` |"
            echo "| Mode | \`patch\` → \`pr\` |"
            echo "| Timeout | 3 hours |"
            echo "| Maximum diff | 100 KiB |"
            echo "| Kaseki run | \`$RUN_ID\` |"
            echo "| Final status | \`$FINAL_STATUS\` |"
            echo
            echo "### Allowed paths"
            echo '```text'
            echo "$ALLOWLIST" | tr ',' '\n'
            echo '```'
            echo
            echo "### Task description"
            echo "$TASK_DESCRIPTION"
            echo
            echo "### Validation"
            echo '```text'
            echo "${VALIDATION_COMMAND:-No validation command configured}"
            echo '```'
            echo
            echo "Monitor the run: $KASEKI_BASE_URL/ui"
          } >> "$GITHUB_STEP_SUMMARY"
