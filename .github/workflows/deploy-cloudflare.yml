name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate-reusable.yml

  deploy:
    # A manually dispatched workflow may be started from any ref in the UI.
    # Production releases must always use the protected default branch.
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Read package version
        id: build
        run: |
          version="$(npm pkg get version | tr -d '"')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Required Cloudflare deployment credentials are not configured."
            exit 1
          fi

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy-output.json
          BUILD_VERSION: ${{ steps.build.outputs.version }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          npx wrangler deploy --var "BUILD_VERSION:$BUILD_VERSION" --var "BUILD_SHA:$BUILD_SHA"
          npm run deployment:record-output
      - name: Probe direct Worker deployment
        run: npm run deployment:health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_BUILD_VERSION: ${{ steps.build.outputs.version }}

      - name: Smoke-test deployed public API
        run: |
          if ! npm run deployment:smoke; then
            echo "::error::Canonical Worker health and build checks passed, but public API smoke checks failed. Review the smoke response body, request ID, Cloudflare Ray ID, and Worker observability logs."
            exit 1
          fi
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_BUILD_VERSION: ${{ steps.build.outputs.version }}

      - name: Contract-test deployed public API
        run: npm run deployment:contract
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_BUILD_VERSION: ${{ steps.build.outputs.version }}
