name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # A manually dispatched workflow may be started from any ref in the UI.
    # Production releases must always use the protected default branch.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Read package version
        id: build
        run: |
          node --print '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Required Cloudflare deployment credentials are not configured."
            exit 1
          fi

      - name: Deploy Worker
        run: npx wrangler deploy --var BUILD_VERSION:${{ steps.build.outputs.version }} --var BUILD_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-test deployed public API
        run: node scripts/smoke-deployment.mjs
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_BUILD_VERSION: ${{ steps.build.outputs.version }}

      - name: Contract-test deployed public API
        run: node scripts/contract-deployment.mjs
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_BUILD_VERSION: ${{ steps.build.outputs.version }}
