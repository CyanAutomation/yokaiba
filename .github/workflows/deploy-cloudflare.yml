name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    # A manually dispatched workflow may be started from any ref in the UI.
    # Production releases must always use the protected default branch.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Read package version
        id: build
        run: |
          node --print '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Required Cloudflare deployment credentials are not configured."
            exit 1
          fi

      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy --var BUILD_VERSION:${{ steps.build.outputs.version }} --var BUILD_SHA:${{ github.sha }}
          node <<'EOF'
          const fs = require("node:fs");
          const records = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").trim().split("\n").map(JSON.parse);
          const deployment = records.findLast(record => record.type === "deploy");
          if (!deployment) throw new Error("Wrangler did not write machine-readable deployment information");
          if (deployment.worker_name !== "yokaiba") throw new Error(`Wrangler deployed unexpected Worker ${JSON.stringify(deployment.worker_name)}`);

          const directUrls = deployment.targets.filter(target => {
            try {
              const url = new URL(target);
              return url.protocol === "https:" && url.hostname.endsWith(".workers.dev");
            } catch {
              return false;
            }
          });
          if (directUrls.length !== 1) {
            throw new Error(`Expected exactly one direct workers.dev deployment target, received ${JSON.stringify(directUrls)}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_url=${directUrls[0]}\n`);
          EOF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy-output.json

      - name: Probe direct Worker deployment
        run: node scripts/health-deployment.mjs
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_BUILD_VERSION: ${{ steps.build.outputs.version }}

      - name: Smoke-test deployed public API
        run: |
          if ! node scripts/smoke-deployment.mjs; then
            echo "::error::The freshly deployed Worker endpoint exposes the expected build, but the canonical endpoint does not. Check that CLOUDFLARE_DEPLOYMENT_URL and its route resolve to the yokaiba Worker in CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_BUILD_VERSION: ${{ steps.build.outputs.version }}

      - name: Contract-test deployed public API
        run: node scripts/contract-deployment.mjs
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_DEPLOYMENT_URL }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_BUILD_VERSION: ${{ steps.build.outputs.version }}
