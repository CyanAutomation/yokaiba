name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint GitHub Actions workflows
        run: |
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -0 docker run --rm \
                --volume "$GITHUB_WORKSPACE:/repo:ro" \
                --workdir /repo \
                rhysd/actionlint@sha256:1d74bfc9fd1963af8f89a7c22afaaafd42f49aad711a09951d02cb996398f61d

      - uses: actions/setup-node@1e60f620b9541d8bcd3c84b123bf50962bb33ba3 # v4.0.4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
